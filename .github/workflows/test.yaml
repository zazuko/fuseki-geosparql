name: Run tests

on:
  push:
    branches:
      - "**"

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install hurl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hurl
          hurl --version

      - name: Run tests
        run: cd tests && ./run.sh && cd -
